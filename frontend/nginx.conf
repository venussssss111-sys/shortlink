# 短链服务的 nginx 配置：静态资源 + 反向代理（/api、/uploads、短码跳转）
#
# 三个不显然的地方，见 docs/部署.md：
#   1. upstream 用 `server backend:8080 resolve;` + resolver，容器重建换 IP 也不会 502
#   2. keepalive 128 + proxy_http_version 1.1：复用后端连接。不配的话每个请求新建一条 TCP，
#      实测 6k QPS 时后端容器里堆了 1.4 万个 TIME_WAIT，nginx 自己吃掉 11 个核
#   3. 短码跳转必须放在前面，否则会掉进 root 的静态文件查找
#
# 端口：容器内 80，宿主 8088（见 docker-compose.yml）

resolver 127.0.0.11 valid=10s ipv6=off;

upstream shortlink_backend {
    zone shortlink_backend 64k;
    server backend:8080 resolve;
    keepalive 128;
    keepalive_requests 10000;
    keepalive_timeout 60s;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log;
    client_max_body_size 4m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml;
    gzip_min_length 1024;

    # 1. 短码跳转：/V0001 这种
    # 正则里的 {} 必须加引号，否则 nginx 会把它当成配置块的括号
    location ~ "^/[A-Za-z0-9]{4,10}$" {
        proxy_pass http://shortlink_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 302 必须原样返回给浏览器，不能被 nginx 自己跟下去
        proxy_redirect off;
    }

    # 2. 后端接口
    location /api/ {
        proxy_pass http://shortlink_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 3. 用户上传的头像（命名卷，见 docker-compose.yml）
    location /uploads/ {
        proxy_pass http://shortlink_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # hash 资源长缓存，改内容必然改文件名
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA：刷新任意前端路由都回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
